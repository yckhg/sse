services:
  nginx:
    image: nginx:latest
    container_name: gateway
    ports:
      - "80:80"
      - "443:443"
      - "20003:20003"
      - "20004:20004"
      - "30033:30033"
      - "30043:30043"
      - "30053:30053"
      - "30063:30063"
      - "30073:30073"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./acme_challenge:/etc/nginx/acme:ro
    networks:
      - yc-network
    restart: always

networks:
  yc-network:
    external: true
    name: yc-network
