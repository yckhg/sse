events { worker_connections 1024; }

http {
    # ===========================
    # Upstream 정의
    # ===========================
    upstream green_web { server ycerp-web-greenpr:8069; }
    upstream green_chat { server ycerp-web-greenpr:8072; }

    upstream media_web { server ycerp-web-mediapolytech:8069; }
    upstream media_chat { server ycerp-web-mediapolytech:8072; }

    upstream visual_web { server ycerp-web-visualoft:8069; }
    upstream visual_chat { server ycerp-web-visualoft:8072; }

    upstream jnj_web { server ycerp-web-jnj_i:8069; }
    upstream jnj_chat { server ycerp-web-jnj_i:8072; }

    upstream free_web { server ycerp-web-freeworks:8069; }
    upstream free_chat { server ycerp-web-freeworks:8072; }

    # ===========================
    # 공통 설정
    # ===========================
    client_max_body_size 100M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # SSL 공통 설정 (SAN 인증서 — 전 도메인 커버)
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_certificate /etc/letsencrypt/live/greenpr.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenpr.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 웹소켓 업그레이드 맵
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 프록시 헤더 공통 설정 (전 location 블록에 상속)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ===========================
    # HTTP — ACME Challenge & HTTPS 리디렉션
    # ===========================
    server {
        listen 80;
        server_name greenpr.online mediapolytech.online visualoft.online jnj-i.online freeworkskr.online freeworks.online;

        location /.well-known/acme-challenge/ {
            root /etc/nginx/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================
    # HTTPS 서버 블록
    # ===========================

    # 1. GreenPR
    server {
        listen 443 ssl;
        http2 on;
        server_name greenpr.online;

        location / { proxy_pass http://green_web; }
        location /websocket { proxy_pass http://green_chat; }
        location /longpolling { proxy_pass http://green_chat; }
    }

    # 2. MediaPolyTech
    server {
        listen 443 ssl;
        http2 on;
        server_name mediapolytech.online;

        location / { proxy_pass http://media_web; }
        location /websocket { proxy_pass http://media_chat; }
        location /longpolling { proxy_pass http://media_chat; }
    }

    # 3. Visualoft
    server {
        listen 443 ssl;
        http2 on;
        server_name visualoft.online;

        location / { proxy_pass http://visual_web; }
        location /websocket { proxy_pass http://visual_chat; }
        location /longpolling { proxy_pass http://visual_chat; }
    }

    # 4. J&J-i
    server {
        listen 443 ssl;
        http2 on;
        server_name jnj-i.online;

        location / { proxy_pass http://jnj_web; }
        location /websocket { proxy_pass http://jnj_chat; }
        location /longpolling { proxy_pass http://jnj_chat; }
    }

    # 5. FreeWorks
    server {
        listen 443 ssl;
        http2 on;
        server_name freeworkskr.online;

        location / { proxy_pass http://free_web; }
        location /websocket { proxy_pass http://free_chat; }
        location /longpolling { proxy_pass http://free_chat; }
    }
}
