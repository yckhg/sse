events { worker_connections 1024; }

http {
    # Upstream 정의
    upstream green_web { server ycerp-web-greenpr:8069; }
    upstream green_chat { server ycerp-web-greenpr:8072; }

    upstream media_web { server ycerp-web-mediapolytech:8069; }
    upstream media_chat { server ycerp-web-mediapolytech:8072; }

    upstream visual_web { server ycerp-web-visualoft:8069; }
    upstream visual_chat { server ycerp-web-visualoft:8072; }

    upstream jnj_web { server ycerp-web-jnj_i:8069; }
    upstream jnj_chat { server ycerp-web-jnj_i:8072; }

    upstream free_web { server ycerp-web-freeworks:8069; }
    upstream free_chat { server ycerp-web-freeworks:8072; }

    # 공통 설정 (server 블록은 상속받지 않으므로 각 location에서 명시 필요)
    client_max_body_size 100M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # SSL/TLS 보안 설정
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ===========================
    # Macro: 프록시 헤더 설정
    # ===========================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ===========================
    # HTTP 서버 - ACME Challenge & HTTPS 리디렉션
    # ===========================
    server {
        listen 80;
        server_name greenpr.online mediapolytech.online visualoft.online jnj-i.online freeworkskr.online freeworks.online;

        location /.well-known/acme-challenge/ {
            root /etc/nginx/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 1. GreenPR
    server {
        listen 443 ssl http2;
        server_name greenpr.online;

        ssl_certificate /etc/letsencrypt/live/greenpr.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/greenpr.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            proxy_pass http://green_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /websocket {
            proxy_pass http://green_chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
        }

        location /longpolling {
            proxy_pass http://green_chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }

    # 2. MediaPolyTech
