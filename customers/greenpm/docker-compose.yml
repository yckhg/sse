services:
  db:
    build:
      context: ../../
      dockerfile: Dockerfile.db
    container_name: ycerp-db-greenpm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: odoo
      POSTGRES_USER: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - yc-network

  web:
    build:
      context: ../../
      dockerfile: Dockerfile.web
    container_name: ycerp-web-greenpm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:30083:8069"
    environment:
      # DB 접속 정보는 config/odoo.conf 에서 관리
      ODOO_AUTO_INIT: "true"
      WITHOUT_DEMO: "all"
      LOG_LEVEL: info
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ../../odoo-19.0+e.20260101/odoo/addons:/usr/lib/python3/dist-packages/odoo/addons
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons:ro
    restart: always
    networks:
      - yc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/odoo"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  odoo-db-data:
  odoo-web-data:

networks:
  yc-network:
    external: true
