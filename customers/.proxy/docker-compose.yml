services:
  nginx:
    image: nginx:latest
    container_name: central-nginx
    restart: always
    ports:
      - "20003:20003"
      - "20004:20004"
      - "30033:30033"
      - "30043:30043"
      - "30053:30053"
      - "30063:30063"
      - "30073:30073"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - yc-network

networks:
  yc-network:
    external: true